<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logic Lab | 논리회로 웹 실험실</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Digital Logic Circuit Simulator</p>
      <h1>Logic Lab</h1>
      <p class="subtitle">입력값을 바꾸며 논리 게이트의 출력과 진리표를 바로 확인하는 웹 기반 논리회로 실험실</p>
    </div>
  </header>

  <main class="container">
    <section class="panel gate-panel">
      <h2>1. 논리 게이트 선택</h2>
      <div class="gate-buttons" id="gateButtons">
        <button class="gate-btn active" data-gate="AND">AND</button>
        <button class="gate-btn" data-gate="OR">OR</button>
        <button class="gate-btn" data-gate="NOT">NOT</button>
        <button class="gate-btn" data-gate="NAND">NAND</button>
        <button class="gate-btn" data-gate="NOR">NOR</button>
        <button class="gate-btn" data-gate="XOR">XOR</button>
        <button class="gate-btn" data-gate="XNOR">XNOR</button>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>2. 입력값 설정</h2>
        <div class="input-row">
          <span class="input-label">A</span>
          <button class="toggle active" id="a0" data-input="A" data-value="0">0</button>
          <button class="toggle" id="a1" data-input="A" data-value="1">1</button>
        </div>
        <div class="input-row" id="inputBRow">
          <span class="input-label">B</span>
          <button class="toggle active" id="b0" data-input="B" data-value="0">0</button>
          <button class="toggle" id="b1" data-input="B" data-value="1">1</button>
        </div>
        <p class="hint" id="inputHint">현재 선택한 게이트는 입력 A, B를 사용합니다.</p>
      </article>

      <article class="panel output-card">
        <h2>3. 출력 확인</h2>
        <div class="circuit-preview">
          <span class="wire">A</span>
          <div class="gate-shape" id="gateShape">AND</div>
          <span class="wire output-wire">Y</span>
        </div>
        <div class="result-box">
          <div class="led" id="led"></div>
          <p>출력값 <strong>Y = <span id="outputValue">0</span></strong></p>
        </div>
      </article>
    </section>

    <section class="grid">
      <article class="panel explanation-card">
        <h2>4. 게이트 설명</h2>
        <h3 id="gateTitle">AND 게이트</h3>
        <p class="formula" id="gateFormula">Y = A · B</p>
        <p id="gateDescription">AND 게이트는 모든 입력이 1일 때만 출력이 1이 됩니다.</p>
      </article>

      <article class="panel truth-card">
        <h2>5. 진리표</h2>
        <table>
          <thead id="truthHead"></thead>
          <tbody id="truthBody"></tbody>
        </table>
      </article>
    </section>
  </main>

  <footer>
    <p>Logic Lab · 논리회로 기본 게이트 실험 웹사이트</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
